# == Deploy Seam: CodeSmith.Executor image to ACR == #
# Manually triggered. Builds the multi-language session container used by
# Azure Container Apps custom Dynamic Sessions (not a normal Container App).
# Session pool create/update is one-time az CLI — see Docs/general/dynamic-sessions-azure-setup.md

name: Deploy Executor

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name acrcodesmithprod001

      - name: Build and push executor image
        run: |
          docker buildx build \
            --push \
            -t acrcodesmithprod001.azurecr.io/codesmith-executor:${{ github.sha }} \
            -t acrcodesmithprod001.azurecr.io/codesmith-executor:latest \
            -f CodeSmith.Executor/Dockerfile \
            .
