# == Deploy Seam: CodeSmith.Executor to ACR + Container App == #
# Manually triggered. Builds the multi-language code sandbox image and rolls it out to
# ca-codesmith-exec-001, a scale-to-zero Container App on internal ingress.
#
# Prerequisites (one-time, run by user — see Docs/general/executor-container-app-setup.md):
# - ca-codesmith-exec-001 created with --system-assigned, --ingress internal, --target-port 8080,
#   --min-replicas 0, and an HTTP scale rule at concurrency 1
# - That app's SYSTEM-assigned principal granted AcrPull on acrcodesmithprod001
# - API env: CodeExecution__Backend=Executor + CodeExecution__Executor__BaseUrl=<internal fqdn>
#
# The executor deliberately does NOT use mi-codesmith-backend-prod-centralus-001 (the API's
# identity). That MI can reach Key Vault and SQL; untrusted student code runs in this container
# and could mint tokens for it via IMDS. Its own system-assigned identity holds AcrPull only.

name: Deploy Executor

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name acrcodesmithprod001

      - name: Build and push executor image
        run: |
          docker buildx build \
            --push \
            -t acrcodesmithprod001.azurecr.io/codesmith-executor:${{ github.sha }} \
            -t acrcodesmithprod001.azurecr.io/codesmith-executor:latest \
            -f CodeSmith.Executor/Dockerfile \
            .

      - name: Configure ACR registry with system-assigned identity
        # Idempotent. --identity system keeps image pull scoped to this app's own principal.
        run: |
          az containerapp registry set \
            --name ca-codesmith-exec-001 \
            --resource-group rg-codesmith-prod-centralus-001 \
            --server acrcodesmithprod001.azurecr.io \
            --identity system

      - name: Update Container App image
        # Deploys the sha tag (not :latest) so each Container Apps revision maps to an exact commit.
        run: |
          az containerapp update \
            --name ca-codesmith-exec-001 \
            --resource-group rg-codesmith-prod-centralus-001 \
            --image acrcodesmithprod001.azurecr.io/codesmith-executor:${{ github.sha }}
